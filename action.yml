name: Flakewatch
description: Generate a static HTML report for flaky and slow tests from JUnit XML.

inputs:
  junit:
    description: JUnit XML glob. Defaults to minitest-ci output.
    required: false
    default: test/reports/**/*.xml
  output:
    description: HTML report output path.
    required: false
    default: flakewatch.html
  source-base-url:
    description: Base URL for source links.
    required: false
    default: ""
  source-root:
    description: Local source root used to infer Ruby test line links.
    required: false
    default: "."
  version:
    description: Flakewatch release version to install.
    required: false
    default: v0.6.34
  upload-artifact:
    description: Upload the generated HTML report as a GitHub Actions artifact.
    required: false
    default: "true"
  artifact-name:
    description: GitHub Actions artifact name for the generated HTML report.
    required: false
    default: flakewatch.html
  junit-artifact-pattern:
    description: JUnit XML artifact name pattern to download before generating the report, for example junit-*. When set, Flakewatch reads XML from download-artifact-path/**/*.xml.
    required: false
    default: ""
  download-artifacts:
    description: Download JUnit XML artifacts before generating the report. Enable this in a fan-in job after matrix test jobs upload their XML.
    required: false
    default: "false"
  download-artifact-pattern:
    description: Artifact name pattern to download when download-artifacts is true, for example junit-*.
    required: false
    default: ""
  download-artifact-path:
    description: Destination directory for downloaded JUnit XML artifacts.
    required: false
    default: test-results
  merge-artifacts:
    description: Merge downloaded artifacts into download-artifact-path.
    required: false
    default: "true"
  update-pr-description:
    description: Add or update a Flakewatch report link in the pull request description.
    required: false
    default: "true"
  add-job-summary:
    description: Add a Flakewatch report link to the GitHub Actions job summary.
    required: false
    default: "true"
  history-branch:
    description: Git branch used to persist JSONL test history. Leave empty to disable persistent history. Pull request events can read history, but the default auto write mode writes only outside pull_request events.
    required: false
    default: ""
  history-write:
    description: Write JSONL history to history-branch. Auto writes pushes and same-repository pull requests, but not fork pull requests.
    required: false
    default: auto
  analysis-branch:
    description: Branch whose history is analyzed, or * for all branches.
    required: false
    default: "*"

runs:
  using: composite
  steps:
    - name: Install flakewatch
      shell: bash
      run: |
        install_dir="${RUNNER_TEMP}/flakewatch"
        mkdir -p "$install_dir"
        if [ "${{ inputs.version }}" = "local" ]; then
          cd "${{ github.action_path }}"
          tya build src/main.tya -o "$install_dir/flakewatch"
        else
          FLAKEWATCH_VERSION="${{ inputs.version }}" \
            FLAKEWATCH_INSTALL_DIR="$install_dir" \
            sh "${{ github.action_path }}/install.sh"
        fi
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Checkout flakewatch history
      id: flakewatch-history
      if: inputs.history-branch != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HISTORY_BRANCH: ${{ inputs.history-branch }}
      run: |
        history_dir="${RUNNER_TEMP}/flakewatch-history"
        mkdir -p "$history_dir"
        git init "$history_dir"
        cd "$history_dir"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        if git fetch --depth=1 origin "${HISTORY_BRANCH}"; then
          git checkout -B "${HISTORY_BRANCH}" "origin/${HISTORY_BRANCH}"
        else
          git checkout --orphan "${HISTORY_BRANCH}"
          git rm -rf . || true
        fi

        mkdir -p history
        cutoff="$(date -u -d '13 days ago' +%Y%m%d)"
        find history -mindepth 4 -maxdepth 4 -name '*.jsonl' -type f -print0 |
          while IFS= read -r -d '' history_file; do
            relative="${history_file#history/}"
            year="${relative%%/*}"
            relative="${relative#*/}"
            month="${relative%%/*}"
            relative="${relative#*/}"
            day="${relative%%/*}"
            date_key="${year}${month}${day}"
            if [[ "$date_key" =~ ^[0-9]{8}$ ]] && ((10#$date_key < 10#$cutoff)); then
              rm -f -- "$history_file"
            fi
          done
        find history -name '*.jsonl' -type f -print0 |
          xargs -0 -r perl -CS -i -pe 's/&/\\u0026/g; s/([^\x00-\x7F])/sprintf("\\u%04x", ord($1))/ge'
        echo "dir=${history_dir}" >> "$GITHUB_OUTPUT"
        echo "pattern=${history_dir}/history/**/*.jsonl" >> "$GITHUB_OUTPUT"

    - name: Decide whether to write flakewatch history
      id: flakewatch-history-policy
      if: inputs.history-branch != ''
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
        WRITE_MODE: ${{ inputs.history-write }}
      run: |
        write=false
        if [ "$WRITE_MODE" = "true" ]; then
          write=true
        elif [ "$WRITE_MODE" = "auto" ]; then
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            write=true
          fi
        fi
        echo "write=${write}" >> "$GITHUB_OUTPUT"

    - name: Download JUnit artifacts by pattern
      if: (inputs.download-artifacts == 'true' && inputs.download-artifact-pattern != '') || inputs.junit-artifact-pattern != ''
      uses: actions/download-artifact@v7
      with:
        pattern: ${{ inputs.junit-artifact-pattern != '' && inputs.junit-artifact-pattern || inputs.download-artifact-pattern }}
        path: ${{ inputs.download-artifact-path }}
        merge-multiple: ${{ inputs.merge-artifacts }}

    - name: Download all JUnit artifacts
      if: inputs.download-artifacts == 'true' && inputs.download-artifact-pattern == '' && inputs.junit-artifact-pattern == ''
      uses: actions/download-artifact@v7
      with:
        path: ${{ inputs.download-artifact-path }}
        merge-multiple: ${{ inputs.merge-artifacts }}

    - name: Generate flakewatch report
      shell: bash
      env:
        ANALYSIS_BRANCH: ${{ inputs.analysis-branch }}
        HISTORY_PATTERN: ${{ steps.flakewatch-history.outputs.pattern }}
      run: |
        workspace="${GITHUB_WORKSPACE:-$PWD}"

        absolute_path() {
          case "$1" in
            /*) printf '%s\n' "$1" ;;
            *) printf '%s\n' "${workspace}/${1}" ;;
          esac
        }

        junit_pattern="${{ inputs.junit }}"
        if [ -n "${{ inputs.junit-artifact-pattern }}" ]; then
          junit_pattern="$(absolute_path "${{ inputs.download-artifact-path }}")/**/*.xml"
        else
          case "$junit_pattern" in
            /*) ;;
            *) junit_pattern="${workspace}/${junit_pattern}" ;;
          esac
        fi

        output_path="$(absolute_path "${{ inputs.output }}")"
        source_root="$(absolute_path "${{ inputs['source-root'] }}")"

        if [ -n "${{ inputs['source-base-url'] }}" ]; then
          source_base_url="${{ inputs['source-base-url'] }}"
        else
          source_base_url="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}"
        fi

        args=(
          "--junit=$junit_pattern"
          "--output=$output_path"
          "--analysis-branch=$ANALYSIS_BRANCH"
          "--source-base-url=$source_base_url"
          "--source-root=$source_root"
        )

        if [ -n "$HISTORY_PATTERN" ]; then
          args+=("--history=$HISTORY_PATTERN")
        fi

        if [ -n "${{ steps.flakewatch-history.outputs.dir }}" ]; then
          if [ "${{ steps.flakewatch-history-policy.outputs.write }}" = "true" ]; then
            day="$(date -u +%Y/%m/%d)"
            run_file="${{ steps.flakewatch-history.outputs.dir }}/history/${day}/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}.jsonl"
            mkdir -p "$(dirname "$run_file")"
            args+=("--history-output=$run_file")
          fi
        fi

        set +e
        cd "${{ github.action_path }}"
        flakewatch_log="${RUNNER_TEMP}/flakewatch.log"
        flakewatch "${args[@]}" >"$flakewatch_log" 2>&1
        flakewatch_status=$?
        cat "$flakewatch_log"
        set -e
        if [ ! -s "$output_path" ]; then
          echo "::warning::flakewatch did not create a non-empty '${{ inputs.output }}'; writing a fallback report."
          node - "$output_path" "$flakewatch_status" "$flakewatch_log" "${args[@]}" <<'NODE'
        const fs = require("fs")

        const [outputPath, status, logPath, ...args] = process.argv.slice(2)
        const escape = (value) => String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
        const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, "utf8") : ""
        const html = `<!doctype html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>Flakewatch report unavailable</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 32px; color: #1f2937; background: #f8fafc; }
            pre { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; overflow: auto; }
          </style>
        </head>
        <body>
          <h1>Flakewatch report unavailable</h1>
          <p>flakewatch exited with status ${escape(status)} before creating a report.</p>
          <h2>Arguments</h2>
          <pre>${escape(args.join("\n"))}</pre>
          <h2>Log</h2>
          <pre>${escape(log)}</pre>
        </body>
        </html>`
        fs.writeFileSync(outputPath, html)
        NODE
        fi
        if [ "$flakewatch_status" -ne 0 ]; then
          echo "::warning::flakewatch exited with status ${flakewatch_status}, but generated '${{ inputs.output }}'."
        fi

    - name: Commit flakewatch history
      if: inputs.history-branch != '' && steps.flakewatch-history-policy.outputs.write == 'true'
      shell: bash
      env:
        HISTORY_DIR: ${{ steps.flakewatch-history.outputs.dir }}
        HISTORY_BRANCH: ${{ inputs.history-branch }}
      run: |
        cd "$HISTORY_DIR"
        git add history
        git commit -m "Add flakewatch history for run ${GITHUB_RUN_ID}" || exit 0

        for attempt in 1 2 3; do
          if git push origin "HEAD:${HISTORY_BRANCH}"; then
            exit 0
          fi
          git fetch --depth=1 origin "${HISTORY_BRANCH}"
          git rebase "origin/${HISTORY_BRANCH}"
          sleep "$((attempt * 2))"
        done

        git push origin "HEAD:${HISTORY_BRANCH}"

    - name: Explain skipped flakewatch history
      if: inputs.history-branch != '' && inputs.history-write == 'auto' && github.event_name == 'pull_request' && steps.flakewatch-history-policy.outputs.write != 'true'
      shell: bash
      run: |
        echo "::notice::Flakewatch read history from '${{ inputs.history-branch }}' but skipped writing history because this pull request comes from a fork. Fork workflows cannot update the persistent history branch."

    - name: Upload flakewatch report
      id: upload-flakewatch-report
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
        archive: false
        if-no-files-found: error

    - name: Add flakewatch summary
      if: inputs.add-job-summary == 'true' && inputs.upload-artifact == 'true'
      shell: bash
      env:
        REPORT_URL: ${{ steps.upload-flakewatch-report.outputs.artifact-url }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        REPORT_PATH: ${{ inputs.output }}
      run: |
        report_metrics="$(node <<'NODE'
        const fs = require("fs")
        const path = require("path")

        const workspace = process.env.GITHUB_WORKSPACE || process.cwd()
        const reportPath = path.isAbsolute(process.env.REPORT_PATH)
          ? process.env.REPORT_PATH
          : path.join(workspace, process.env.REPORT_PATH)
        const html = fs.existsSync(reportPath) ? fs.readFileSync(reportPath, "utf8") : ""
        const metrics = Array.from(html.matchAll(/<div class="metric"><strong>(.*?)<\/strong>(.*?)<\/div>/g))
          .map((match) => `${match[2].trim()}: ${match[1].trim()}`)

        if (metrics.length > 0) {
          console.log(metrics.join(" / "))
        }
        NODE
        )"

        {
          echo "## Flakewatch"
          echo ""
          echo "<a href=\"${REPORT_URL}\" target=\"_blank\" rel=\"noopener noreferrer\">Open ${ARTIFACT_NAME}</a>"
          if [ -n "$report_metrics" ]; then
            echo ""
            echo "$report_metrics"
          fi
          echo ""
          echo "Open the generated HTML report in a new browser tab."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Update PR description with flakewatch report
      if: github.event_name == 'pull_request' && inputs.update-pr-description == 'true' && inputs.upload-artifact == 'true'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_URL: ${{ steps.upload-flakewatch-report.outputs.artifact-url }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        node <<'NODE'
        const markerStart = "<!-- flakewatch-report:start -->"
        const markerEnd = "<!-- flakewatch-report:end -->"
        const apiUrl = process.env.GITHUB_API_URL || "https://api.github.com"
        const repo = process.env.GITHUB_REPOSITORY
        const prNumber = process.env.PR_NUMBER
        const token = process.env.GITHUB_TOKEN
        const artifactName = process.env.ARTIFACT_NAME
        const reportUrl = process.env.REPORT_URL
        const bannerUrl = "https://raw.githubusercontent.com/komagata/flakewatch/main/assets/flakewatch-report.svg"

        const block = [
          markerStart,
          "## Flakewatch Report",
          "",
          `<a href="${reportUrl}" target="_blank" rel="noopener noreferrer"><img src="${bannerUrl}" alt="Open ${artifactName}" width="150"></a>`,
          markerEnd
        ].join("\n")

        const headers = {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28"
        }

        async function main() {
          const prUrl = `${apiUrl}/repos/${repo}/pulls/${prNumber}`
          const response = await fetch(prUrl, { headers })
          if (!response.ok) {
            throw new Error(`Failed to fetch PR body: ${response.status} ${await response.text()}`)
          }

          const pr = await response.json()
          const body = (pr.body || "").trimEnd()
          const pattern = /<!-- flakewatch-report:start -->[\s\S]*?<!-- flakewatch-report:end -->/

          const nextBody = pattern.test(body)
            ? body.replace(pattern, block)
            : `${body}\n\n${block}`.trim()

          const updateResponse = await fetch(prUrl, {
            method: "PATCH",
            headers: {
              ...headers,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ body: `${nextBody}\n` })
          })

          if (!updateResponse.ok) {
            throw new Error(`Failed to update PR body: ${updateResponse.status} ${await updateResponse.text()}`)
          }
        }

        main().catch((error) => {
          console.error(error)
          process.exit(1)
        })
        NODE
